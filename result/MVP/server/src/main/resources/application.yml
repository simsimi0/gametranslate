server:
  address: 0.0.0.0
  port: ${PORT:10000}

spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

gemini:
  api-key: ${GOOGLE_API_KEY:${GEMINI_API_KEY:}}
  model: ${GEMINI_MODEL:gemini-3.6-flash}

management:
  endpoints:
    web:
      exposure:
        include: health
